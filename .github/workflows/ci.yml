name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ruff 检查
        run: |
          pip install ruff
          ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install pandas openpyxl
      - name: 数据库分析脚本冒烟
        run: |
          python -m py_compile main_analysis.py analysis_project_v2.py analysis_achevement_project_v2.py
          python main_analysis.py
